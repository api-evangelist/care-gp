name: Care GP
description: >-
  Care GP is a Sydney-based healthcare technology company (Y Combinator Summer 2026)
  building a suite of AI agents that automate the administrative and operational work of
  Australian general practice clinics. Its products include Samantha (medical document
  allocation that files inbound emails, faxes, and scans), Veronica (24/7 inbound and
  outbound phone and booking management), and a Billing beta for billing and debt-collection
  automation. Care GP states it is ISO 27001 certified with onshore Australian data storage,
  multi-factor authentication, and encryption, and reports serving 400+ clinic operators. As
  of this enrichment pass the company exposes a customer web application (agent.caregp.com.au)
  but no public developer portal, API documentation, or OpenAPI definition.
